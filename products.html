<body>



<!-- HEADER -->

<div id="header"></div>




<!-- PAGE TITLE -->

<section class="page-title">


<div class="container">


<h1>
Մեր տեսականին
</h1>


<p>
Ընտրեք գեղեցիկ և որակյալ ծաղկեպսակներ
</p>


</div>


</section>






<!-- PRODUCTS -->

<section class="products-section">


<div class="container">



<!-- FILTERS -->


<div class="shop-tools">



<div class="search-box">


<i class="bi bi-search"></i>


<input
type="search"
id="searchInput"
placeholder="Փնտրել պսակ..."
>


</div>





<select id="categoryFilter">


<option value="all">
Բոլոր կատեգորիաները
</option>


<option value="Վարդեր">
Վարդեր
</option>


<option value="Դասական">
Դասական
</option>


<option value="Խառը">
Խառը
</option>


</select>





<select id="priceFilter">


<option value="all">
Բոլոր գները
</option>


<option value="30000">
Մինչև 30 000 ֏
</option>


<option value="50000">
Մինչև 50 000 ֏
</option>


<option value="50001">
50 000 ֏-ից բարձր
</option>


</select>



</div>





<!-- PRODUCTS GENERATED BY JS -->


<div
class="row g-4"
id="productContainer">
</div>



</div>


</section>







<!-- MINI CART -->


<div class="mini-cart" id="miniCart">


<div class="mini-cart-header">

<i class="bi bi-cart3"></i>

Զամբյուղ

</div>




<div class="mini-cart-body">


<p>

Ապրանքներ՝

<strong id="miniCartCount">
0
</strong>


</p>



<p>

Գումար՝

<strong id="miniCartTotal">
0 ֏
</strong>


</p>


</div>




<a href="cart.html"
class="mini-cart-btn">

Դիտել զամբյուղը

</a>



<a href="checkout.html"
class="mini-order-btn">

Պատվիրել հիմա

</a>



</div>

<div id="footer"></div>
