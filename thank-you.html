<!DOCTYPE html>
<html lang="hy">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Շնորհակալություն | Ծաղկեպսակներ</title>


<link 
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
rel="stylesheet">


<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/header.css">

<link rel="stylesheet" href="css/footer.css">


<style>

.thank-page{

min-height:70vh;

display:flex;

align-items:center;

justify-content:center;

background:#f8f4ee;

}


.thank-card{

background:white;

padding:50px;

border-radius:25px;

text-align:center;

box-shadow:0 15px 35px rgba(0,0,0,.1);

max-width:600px;

}


.thank-icon{

font-size:70px;

color:#1f4d3a;

margin-bottom:20px;

}


.thank-card h1{

font-family:"Playfair Display",serif;

color:#1f4d3a;

font-size:42px;

}


.thank-card p{

font-size:18px;

color:#555;

line-height:1.7;

}


.home-btn{

display:inline-flex;

margin-top:25px;

padding:14px 35px;

border-radius:30px;

background:#1f4d3a;

color:white;

text-decoration:none;

font-weight:700;

transition:.3s;

}


.home-btn:hover{

background:#3e6b55;

color:white;

transform:translateY(-3px);

}

</style>


</head>


<body>


<div id="header"></div>


<section class="thank-page">


<div class="thank-card">


<div class="thank-icon">

<i class="bi bi-check-circle-fill"></i>

</div>


<h1>
Շնորհակալություն
</h1>


<p>

Ձեր պատվերը հաջողությամբ ընդունվել է։  
<br>

Մենք շուտով կկապվենք Ձեզ հետ պատվերը հաստատելու համար։

</p>


<a href="index.html" class="home-btn">

<i class="bi bi-house"></i>

Վերադառնալ գլխավոր էջ

</a>


</div>


</section>


<div id="footer"></div>


<script src="js/components.js"></script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
